[package]
name = "rspec-aim"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rspec-core = { path = "../core" }
rspec-input = { path = "../input" }
rspec-analysis = { path = "../analysis" }
rspec-recommender = { path = "../recommender" }
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

serde_json = "1"

# só para compilar e rodar os testes no Linux; o alvo do app é Windows 11
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
